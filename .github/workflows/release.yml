name: build and publish repo

# diffTerm is a port in the ios-port-ci sense: this repository supplies *what
# it ships* (the three scripts in tools/, everything in packaging/) and
# realAndi/ios-port-ci supplies *how it gets published* -- build orchestration,
# the APT index, GPG signing, the deploy to Pages. See that repo's CONTRACT.md.
#
# Every push to main republishes the current Makefile VERSION with
# packaging/revision applied (2.0-1, 2.0-2, ...); bump the revision to have
# Sileo offer an update. A tag push of v2.1 ships as exactly 2.1. All previous
# versions stay downloadable, so rollback is a normal package operation.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (blank = the Makefile's VERSION)"
        required: false

# The reusable workflow needs these, and a caller cannot grant more than it has.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # A job that calls a reusable workflow is only `uses:`/`with:`/`secrets:` --
  # no steps of its own -- so everything below is inputs.
  publish:
    uses: realAndi/ios-port-ci/.github/workflows/publish.yml@v1
    with:
      package: dev.diffterm.app
      origin: diffTerm
      label: diffTerm
      # Debian control format: the first line is the summary, continuation
      # lines are indented by one space, and a lone " ." is a paragraph break.
      # `|-` and not `|` -- a trailing newline would land a blank line in
      # Release, which ends the stanza and orphans Date and every checksum
      # below it.
      description: |-
        diffTerm
         A terminal emulator for jailbroken iOS, built from source in this
         repository.
         .
         Shells are owned by a launchd daemon rather than the app, so
         backgrounding or force-quitting diffTerm kills nothing; a reopened
         tab reattaches and replays what it missed. The emulator implements
         the DEC VT500 state machine, 24-bit colour, mouse reporting, Sixel
         and iTerm2 inline images, and OSC 133 command blocks.
      # The Makefile cross-builds with Xcode's iPhoneOS SDK on a Mac; ldid
      # signs everything. No Go anywhere -- go-version stays unset.
      brew-packages: ldid
      # Keeps the published key at the URL the control file and depiction
      # reference. Each port signs with its OWN key: reallyitsandi.com pins
      # this fingerprint and refuses an index it cannot verify.
      key-file: diffterm.gpg
      # A tag push ships its own version; anything else discovers the Makefile's.
      version: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
      payload-paths: |
        packaging/payload/
    secrets:
      GPG_KEY: ${{ secrets.DIFFTERM_GPG_KEY }}
      GPG_KEY_ID: ${{ secrets.DIFFTERM_GPG_KEY_ID }}
